name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.0'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Prepare debug keystore
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkey -v -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Ensure Rust Android target
        run: |
          if command -v rustup >/dev/null 2>&1; then
            rustup target add aarch64-linux-android || true
            rustup show || true
          fi

      - name: Build release APK (arm64)
        run: |
          flutter build apk --release --target-platform android-arm64 || echo "flutter did not report apk path; searching..."
          echo "=== locate apk files ==="
          find "$GITHUB_WORKSPACE" -name "*.apk" -type f -printf "%s\t%p\n" || true
          mkdir -p artifact
          find "$GITHUB_WORKSPACE" -name "*.apk" -type f -exec cp {} artifact/ \;
          ls -lh artifact || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: student-assistant-apk
          path: artifact/*.apk
          if-no-files-found: warn

      - name: Publish Release
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.4.0
          name: 学生智能助手 v1.4.0（AI 优化版）
          body: |
            ## 本次更新
            - AI 模型下载入口独立成「AI 模型」页，不再占用对话历史空间
            - 修复下载模型后发消息一直"思考"的问题
            - 修复发消息后下载框重复出现的问题
            - 模型服务单例化，加载失败自动降级，下载支持断点续传
          files: artifact/*.apk
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
