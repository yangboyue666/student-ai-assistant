name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.0'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Prepare debug keystore
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkey -v -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Ensure Rust Android target
        run: |
          if command -v rustup >/dev/null 2>&1; then
            rustup target add aarch64-linux-android || true
            rustup show || true
          fi

      - name: Build release APK (arm64)
        run: flutter build apk --release --target-platform android-arm64 --verbose

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: student-assistant-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
