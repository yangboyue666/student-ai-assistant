name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.0'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Prepare debug keystore
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkey -v -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Ensure Rust Android target
        run: |
          if command -v rustup >/dev/null 2>&1; then
            rustup target add aarch64-linux-android || true
            rustup show || true
          fi

      - name: Build release APK (arm64)
        run: |
          flutter build apk --release --target-platform android-arm64 || echo "flutter did not report apk path; searching..."
          echo "=== locate apk files ==="
          find "$GITHUB_WORKSPACE" -name "*.apk" -type f -printf "%s\t%p\n" || true
          mkdir -p artifact
          find "$GITHUB_WORKSPACE" -name "*.apk" -type f -exec cp {} artifact/ \;
          ls -lh artifact || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: student-assistant-apk
          path: artifact/*.apk
          if-no-files-found: warn

      - name: Publish Release
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.5.0
          name: 学生智能助手 v1.5.0（多模型 + AI 对话优化版）
          body: |
            ## 本次更新
            - 多模型支持：可选 Qwen3 0.6B / 1.7B / 4B 三档模型，按需下载
            - 千问模型真正接入对话：使用 complete() 传入完整对话历史，多轮上下文连贯
            - 改善系统提示词：模型优先直接回答问题，减少误触发工具调用
            - 升级 nobodywho 至 4.0.0：支持完整对话历史、Qwen3 模板变量、性能优化
            - 下载完成后自动设为当前模型，回到对话即可使用
            - AI 模型页展示模型列表，可下载、切换、删除
          files: artifact/*.apk
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
